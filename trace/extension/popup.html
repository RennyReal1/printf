<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1a1a1a;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
        letter-spacing: 0.02em;
      }
      .status {
        padding: 8px 10px;
        border-radius: 6px;
        margin-bottom: 12px;
        font-size: 12px;
      }
      .status.ok {
        background: #dafbe1;
        color: #1a7f37;
      }
      .status.bad {
        background: #ffebe9;
        color: #b42318;
      }
      label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #57606a;
        margin: 8px 0 3px;
      }
      input,
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        font: inherit;
      }
      textarea {
        min-height: 60px;
        resize: vertical;
      }
      button {
        margin-top: 8px;
        padding: 7px 12px;
        border: none;
        border-radius: 6px;
        background: #1f6feb;
        color: #fff;
        font: 500 13px inherit;
        cursor: pointer;
      }
      button.secondary {
        background: #eaeef2;
        color: #24292f;
      }
      #result {
        margin-top: 12px;
        font-size: 13px;
      }
      .src {
        font-size: 11px;
        color: #57606a;
      }
      code {
        background: #f6f8fa;
        padding: 1px 5px;
        border-radius: 4px;
        font-family: ui-monospace, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <h1>Trace</h1>
    <div id="status" class="status">checking backend…</div>

    <label for="port">Backend port</label>
    <input id="port" type="number" value="8765" />

    <label for="paste">Explain a passage (paste fallback)</label>
    <textarea id="paste" placeholder="Paste a highlighted passage — useful in Chrome's native PDF viewer, where in-page highlighting isn't available."></textarea>
    <button id="explainBtn">Explain</button>
    <button id="genericBtn" class="secondary">Generic (no corpus)</button>

    <div id="result"></div>

    <script src="popup.js"></script>
  </body>
</html>
